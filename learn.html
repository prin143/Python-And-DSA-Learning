<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Learn — PyLearn Pro</title>
  <meta name="description" content="Deep-dive topic learning with notes, examples, and cheat sheets."/>
  <link rel="stylesheet" href="styles/main.css"/>
  <!-- Prism for syntax highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
  <style>
    .learn-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start;
    }
    .learn-main { min-width: 0; }
    .learn-sidebar-panel { position: sticky; top: calc(var(--topbar-h) + 24px); }

    .topic-header {
      padding: 28px;
      background: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(79,70,229,0.05));
      border: 1px solid rgba(124,58,237,0.15);
      border-radius: var(--radius-xl);
      margin-bottom: 24px;
    }
    .topic-header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .topic-big-icon { font-size: 48px; }
    .topic-header-info h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .topic-header-meta { font-size: 13px; color: var(--text-secondary); }
    .topic-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .topic-tag {
      padding: 4px 12px;
      background: rgba(124,58,237,0.08);
      border: 1px solid rgba(124,58,237,0.15);
      border-radius: var(--radius-full);
      font-size: 12px; font-weight: 500;
      color: var(--purple-400);
    }

    .content-card { padding: 32px; margin-bottom: 24px; }
    .content-card-title {
      font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .content-card-title::after { content:''; flex:1; height:1px; background:var(--border); }

    .start-test-card {
      padding: 28px;
      background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(6,182,212,0.05));
      border: 1px solid rgba(124,58,237,0.2);
      border-radius: var(--radius-xl);
      text-align: center;
    }
    .test-icon  { font-size: 40px; margin-bottom: 12px; }
    .test-title { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
    .test-desc  { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; }
    .test-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
    .test-stat  { text-align: center; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .test-stat-val  { font-size: 20px; font-weight: 800; }
    .test-stat-lab  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .prev-next-nav {
      display: flex; gap: 12px; margin-top: 24px;
    }
    .prev-next-nav .btn { flex: 1; justify-content: center; }

    .copy-btn {
      position: absolute; top: 10px; right: 10px;
      padding: 4px 10px; font-size: 11px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-muted);
      cursor: pointer; transition: var(--transition);
    }
    .copy-btn:hover { color: var(--purple-400); border-color: var(--purple-500); }
    pre { position: relative !important; }

    @media (max-width: 900px) {
      .learn-layout { grid-template-columns: 1fr; }
      .learn-sidebar-panel { position: static; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size:14px;color:var(--text-muted)">Loading topic...</div>
  </div>
  <div id="toast-container"></div>
  <div id="sidebar" class="sidebar"></div>

  <div class="main-content">
    <div id="topbar" class="topbar"></div>
    <div class="content-wrapper">

      <div class="learn-layout">
        <!-- Main Content -->
        <div class="learn-main">
          <!-- Topic Header -->
          <div class="topic-header" id="topic-header">
            <div style="color:var(--text-muted)">Loading topic...</div>
          </div>

          <!-- Tab: Content | Notes -->
          <div class="tabs mb-24">
            <button class="tab active" id="tab-content" onclick="switchLearnTab('content')">📖 Content</button>
            <button class="tab" id="tab-notes" onclick="switchLearnTab('notes')">📌 Quick Notes</button>
          </div>

          <!-- Content Tab -->
          <div id="learn-content-panel">
            <div class="glass content-card">
              <div class="learn-content" id="learn-content-body">Loading...</div>
            </div>
          </div>

          <!-- Notes Tab -->
          <div id="learn-notes-panel" class="hidden">
            <div class="glass content-card">
              <div class="content-card-title">📌 Quick Reference Cheatsheet</div>
              <div class="notes-grid" id="notes-grid">Loading...</div>
            </div>
          </div>

          <!-- Prev / Next -->
          <div class="prev-next-nav" id="prev-next-nav"></div>
        </div>

        <!-- Sidebar Panel -->
        <div class="learn-sidebar-panel">
          <!-- Test Card -->
          <div class="start-test-card mb-20">
            <div class="test-icon">🎯</div>
            <div class="test-title">Ready for the Test?</div>
            <div class="test-desc" id="test-desc">Solve questions to unlock the next topic.</div>
            <div class="test-stats">
              <div class="test-stat">
                <div class="test-stat-val" id="test-q-count">-</div>
                <div class="test-stat-lab">Questions</div>
              </div>
              <div class="test-stat">
                <div class="test-stat-val" id="test-pass-req">70%</div>
                <div class="test-stat-lab">Pass Mark</div>
              </div>
              <div class="test-stat">
                <div class="test-stat-val" id="test-best-score">-</div>
                <div class="test-stat-lab">Best Score</div>
              </div>
            </div>
            <button class="btn btn-primary w-full" id="start-test-btn" onclick="startTest()" style="justify-content:center;">
              Start Test →
            </button>
            <div id="test-status" class="mt-12" style="font-size:12px;color:var(--text-muted);text-align:center;"></div>
          </div>

          <!-- Topics Progress Mini List -->
          <div class="glass p-20">
            <div class="content-card-title" style="margin-bottom:14px;">📋 All Python Topics</div>
            <div id="mini-topic-list" style="display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentTopic = null;

    async function init() {
      const ok = await requireAuth();
      if (!ok) return;

      const topicId = getUrlParam('topic') || 'py_basics';
      currentTopic = getTopicById(topicId);

      if (!currentTopic) {
        showToast('error','Not Found','Topic not found');
        goToDashboard();
        return;
      }

      // Check if unlocked
      if (!isTopicUnlocked(topicId, currentTopic.type)) {
        showToast('warning','Locked','Complete previous topic first!');
        goToDashboard();
        return;
      }

      renderSidebar('learn');
      renderTopbar('Learning', `<span>📚 ${currentTopic.type.toUpperCase()}</span><span class="topbar-sep">›</span><span>${currentTopic.title}</span>`);
      renderTopicHeader();
      renderContent();
      renderNotes();
      renderTestCard();
      renderMiniTopicList();
      renderPrevNext();
      addCopyButtons();
      hideLoading();

      // Update current topic in profile
      if (AppState.user) {
        dbUpdateProfile(AppState.user.id, {
          current_topic_id: topicId,
          current_topic_type: currentTopic.type
        });
      }
    }

    function renderTopicHeader() {
      const t = currentTopic;
      const prog = AppState.topicProgress?.[t.id] || {};
      const done = prog.is_completed;

      document.getElementById('topic-header').innerHTML = `
        <div class="topic-header-top">
          <div class="topic-big-icon">${t.icon}</div>
          <div class="topic-header-info">
            <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px">
              Topic ${t.order} · ${t.type.toUpperCase()}
            </div>
            <h1>${t.title}</h1>
            <div class="topic-header-meta">${t.desc}</div>
          </div>
          ${done ? '<span class="badge badge-done" style="margin-left:auto;">✓ Completed</span>' : ''}
        </div>
        <div class="topic-tags">
          ${(t.subtopics||[]).map(s => `<span class="topic-tag">${s}</span>`).join('')}
        </div>`;
    }

    function renderContent() {
      document.getElementById('learn-content-body').innerHTML = currentTopic.content || '<p>Content coming soon!</p>';
      // Syntax highlight all pre > code blocks
      document.querySelectorAll('pre').forEach(pre => {
        if (!pre.querySelector('code')) {
          const code = document.createElement('code');
          code.className = 'language-python';
          code.textContent = pre.textContent;
          pre.innerHTML = '';
          pre.appendChild(code);
        }
      });
      if (window.Prism) Prism.highlightAll();
    }

    function renderNotes() {
      const notes = currentTopic.notes || [];
      if (!notes.length) {
        document.getElementById('notes-grid').innerHTML = '<p class="text-muted">Notes coming soon!</p>';
        return;
      }
      document.getElementById('notes-grid').innerHTML = notes.map(n => `
        <div class="note-chip">
          <div class="note-chip-title">${n.title}</div>
          <code>${n.code.replace(/\n/g,'<br>')}</code>
        </div>`).join('');
    }

    function renderTestCard() {
      const topicId = currentTopic.id;
      const qCount  = getQuestionCount(topicId);
      const prog    = AppState.topicProgress?.[topicId] || {};
      const best    = prog.best_score_percentage || 0;
      const done    = prog.is_completed;

      document.getElementById('test-q-count').textContent = qCount;
      document.getElementById('test-best-score').textContent = best > 0 ? best+'%' : '—';

      const btn = document.getElementById('start-test-btn');
      const statusEl = document.getElementById('test-status');
      const descEl = document.getElementById('test-desc');

      if (done) {
        descEl.textContent = '✅ Topic completed! You can retake the test anytime.';
        btn.textContent = '🔄 Retake Test';
        btn.className = 'btn btn-secondary w-full';
        statusEl.textContent = `Best score: ${best}%`;
      } else {
        descEl.textContent = `Score ${APP_CONFIG.PASS_PERCENTAGE}%+ on ${qCount} questions to unlock the next topic.`;
        statusEl.textContent = best > 0 ? `Previous score: ${best}%` : 'First attempt!';
      }
    }

    function startTest() {
      window.location.href = `test.html?topic=${currentTopic.id}`;
    }

    function renderMiniTopicList() {
      const topics = currentTopic.type === 'python' ? PYTHON_TOPICS : DSA_TOPICS;
      const progress = AppState.topicProgress || {};
      const list = document.getElementById('mini-topic-list');
      list.innerHTML = topics.map(t => {
        const prog = progress[t.id] || {};
        const done = prog.is_completed;
        const locked = !prog.is_unlocked;
        const active = t.id === currentTopic.id;
        return `
          <div onclick="${locked?'':  `goToLearn('${t.id}')`}" style="
            display:flex;align-items:center;gap:8px;padding:8px 10px;
            border-radius:var(--radius-md);cursor:${locked?'not-allowed':'pointer'};
            background:${active?'rgba(124,58,237,0.1)':'transparent'};
            border:1px solid ${active?'rgba(124,58,237,0.2)':'transparent'};
            opacity:${locked?0.5:1};
            transition:var(--transition);" onmouseover="${locked?'':  "this.style.background='rgba(255,255,255,0.04)';"}" onmouseout="${active?'':  "this.style.background='transparent';"}">
            <span style="font-size:16px">${t.icon}</span>
            <span style="font-size:12px;font-weight:${active?700:500};flex:1;color:${active?'var(--purple-400)':'var(--text-secondary)'}">${t.title}</span>
            <span style="font-size:14px">${done?'✅':locked?'🔒':active?'▶':'○'}</span>
          </div>`;
      }).join('');
    }

    function renderPrevNext() {
      const topics = currentTopic.type === 'python' ? PYTHON_TOPICS : DSA_TOPICS;
      const idx = topics.findIndex(t => t.id === currentTopic.id);
      const prev = idx > 0 ? topics[idx-1] : null;
      const next = idx < topics.length-1 ? topics[idx+1] : null;
      const progress = AppState.topicProgress || {};

      document.getElementById('prev-next-nav').innerHTML = `
        ${prev
          ? `<button class="btn btn-secondary" onclick="goToLearn('${prev.id}')">← ${prev.title}</button>`
          : '<div></div>'}
        ${next
          ? (progress[next.id]?.is_unlocked
              ? `<button class="btn btn-primary" onclick="goToLearn('${next.id}')">${next.title} →</button>`
              : `<button class="btn btn-secondary" disabled title="Pass test to unlock">🔒 ${next.title}</button>`)
          : '<div></div>'}`;
    }

    function switchLearnTab(tab) {
      document.getElementById('learn-content-panel').classList.toggle('hidden', tab!=='content');
      document.getElementById('learn-notes-panel').classList.toggle('hidden', tab!=='notes');
      document.getElementById('tab-content').classList.toggle('active', tab==='content');
      document.getElementById('tab-notes').classList.toggle('active', tab==='notes');
    }

    function addCopyButtons() {
      document.querySelectorAll('pre').forEach(pre => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = '📋 Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.textContent.trim());
          btn.textContent = '✅ Copied!';
          setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
        };
        pre.style.position = 'relative';
        pre.appendChild(btn);
      });
    }

    init();
  </script>
</body>
</html>
